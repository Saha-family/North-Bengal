<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Jul 2026 - Sept 2026 — Photo Gallery (Kyptronix LLP)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   PHOTO GALLERY — LUXURY EDITORIAL & MOBILE MASONRY
   ============================================================ */

:root {
  /* Light Theme (Editorial Magazine) */
  --page-bg: #ecece9;
  --shell-bg: #ffffff;
  --tile-bg: #f2f2ef;
  --ink: #111110;
  --ink-soft: #666660;
  --ink-muted: #94948c;
  --line: #e6e6e0;
  --pill-bg: #f4f4f1;
  --pill-border: #e2e2dc;
  --btn-glass: rgba(255, 255, 255, 0.85);
  --btn-glass-border: rgba(255, 255, 255, 0.4);
  --shadow-shell: 0 4px 24px rgba(0, 0, 0, 0.04);
  --shadow-card: 0 10px 28px rgba(0, 0, 0, 0.08);

  --font-main: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
  --radius-shell: 36px;
  --radius-tile: 22px;
  --radius-tile-mobile: 18px;
  --gap: 16px;
}

[data-theme="dark"] {
  /* Dark Theme (Mobile App Aesthetic) */
  --page-bg: #09080c;
  --shell-bg: #121017;
  --tile-bg: #1d1a24;
  --ink: #f7f6f9;
  --ink-soft: #a39fb0;
  --ink-muted: #6e697d;
  --line: #272333;
  --pill-bg: #1c1926;
  --pill-border: #2e2a3d;
  --btn-glass: rgba(35, 30, 46, 0.82);
  --btn-glass-border: rgba(255, 255, 255, 0.12);
  --shadow-shell: 0 8px 32px rgba(0, 0, 0, 0.45);
  --shadow-card: 0 12px 28px rgba(0, 0, 0, 0.35);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  scroll-behavior: smooth;
}

body {
  background-color: var(--page-bg);
  color: var(--ink);
  font-family: var(--font-main);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  padding: 28px 18px 60px;
  min-height: 100vh;
  transition: background-color 0.3s ease, color 0.3s ease;
}

/* ---------- Container Shell ---------- */
.shell {
  max-width: 1200px;
  margin: 0 auto;
  background-color: var(--shell-bg);
  border-radius: var(--radius-shell);
  padding: 34px 44px 50px;
  box-shadow: var(--shadow-shell);
  border: 1px solid var(--line);
  transition: background-color 0.3s ease, border-color 0.3s ease;
  position: relative;
}

/* ---------- Navigation ---------- */
.nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding-bottom: 24px;
}

.brand {
  font-weight: 800;
  font-size: 1.22rem;
  letter-spacing: -0.025em;
  color: var(--ink);
  text-decoration: none;
}

.based {
  color: var(--ink-soft);
  font-size: 0.9rem;
  font-weight: 450;
  letter-spacing: -0.01em;
}

.based b {
  color: var(--ink);
  font-weight: 650;
}

.nav-right {
  display: flex;
  align-items: center;
  gap: 12px;
}

.btn-icon {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  border: 1px solid var(--line);
  background: var(--pill-bg);
  color: var(--ink);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: transform 0.2s ease, background 0.2s ease, border-color 0.2s ease;
}

.btn-icon:hover {
  transform: scale(1.08);
  background: var(--tile-bg);
}

.btn-icon svg {
  width: 18px;
  height: 18px;
  stroke: currentColor;
}

/* ---------- Hero Section (Visible on both Desktop & Mobile) ---------- */
.hero {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 28px;
  padding: 10px 0 26px;
  flex-wrap: wrap;
}

.hero-left {
  max-width: 520px;
}

.pill-badge {
  display: inline-block;
  font-size: 0.76rem;
  font-weight: 600;
  color: var(--ink-soft);
  background: var(--pill-bg);
  border: 1px solid var(--pill-border);
  padding: 6px 15px;
  border-radius: 999px;
  margin-bottom: 14px;
  letter-spacing: 0.01em;
}

.hero h1 {
  margin: 0;
  font-size: clamp(2.4rem, 5.2vw, 3.8rem);
  font-weight: 800;
  letter-spacing: -0.035em;
  line-height: 1.05;
  color: var(--ink);
}

.hero-sub {
  color: var(--ink-soft);
  font-size: 0.94rem;
  line-height: 1.6;
  max-width: 44ch;
  text-align: right;
  margin: 0 0 6px;
}

/* ---------- Photo Counter Bar ---------- */
.gallery-status-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-bottom: 16px;
  margin-bottom: 22px;
  border-bottom: 1px solid var(--line);
}

.photo-count-label {
  font-size: 0.84rem;
  color: var(--ink-muted);
  font-weight: 500;
  font-variant-numeric: tabular-nums;
}

/* ============================================================
   BENTO GALLERY (Desktop: 3-Col Bento / Mobile: 2-Col Masonry)
   ============================================================ */

.gallery-container {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  grid-auto-rows: 290px;
  gap: var(--gap);
  grid-auto-flow: dense;
}

.card {
  position: relative;
  overflow: hidden;
  border-radius: var(--radius-tile);
  background-color: var(--tile-bg);
  cursor: pointer;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
  transition: transform 0.35s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.35s ease;
}

.card:hover {
  transform: translateY(-3px);
  box-shadow: var(--shadow-card);
}

.card img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 0.55s cubic-bezier(0.16, 1, 0.3, 1);
  display: block;
}

.card:hover img {
  transform: scale(1.04);
}

/* Shimmer Loading Skeleton */
.card .shimmer {
  position: absolute;
  inset: 0;
  background: linear-gradient(105deg, var(--tile-bg) 25%, var(--line) 50%, var(--tile-bg) 75%);
  background-size: 200% 100%;
  animation: shimmerAnim 1.5s infinite;
  z-index: 1;
  pointer-events: none;
  transition: opacity 0.35s ease;
}

@keyframes shimmerAnim {
  0% { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}

.card.loaded .shimmer {
  opacity: 0;
}

/* Minimal Subtle Download Icon on Card Hover (Desktop only) */
.card-dl-btn {
  position: absolute;
  top: 12px;
  right: 12px;
  width: 34px;
  height: 34px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.9);
  backdrop-filter: blur(12px);
  border: 1px solid rgba(255, 255, 255, 0.4);
  color: #111;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  transform: translateY(-4px);
  transition: all 0.2s ease;
  z-index: 2;
  text-decoration: none;
}

.card:hover .card-dl-btn {
  opacity: 1;
  transform: translateY(0);
}

.card-dl-btn:hover {
  transform: scale(1.1);
  background: #ffffff;
}

/* ============================================================
   DESKTOP ASYMMETRIC BENTO RHYTHM
   ============================================================ */
.card:nth-child(7n+1) {
  grid-column: span 2;
  grid-row: span 1;
}
.card:nth-child(7n+2) {
  grid-column: span 1;
  grid-row: span 1;
}
.card:nth-child(7n+3) {
  grid-column: span 1;
  grid-row: span 1;
}
.card:nth-child(7n+4) {
  grid-column: span 1;
  grid-row: span 1;
}
.card:nth-child(7n+5) {
  grid-column: span 1;
  grid-row: span 1;
}
.card:nth-child(7n+6) {
  grid-column: span 1;
  grid-row: span 1;
}
.card:nth-child(7n) {
  grid-column: span 2;
  grid-row: span 1;
}

/* ============================================================
   MOBILE / RESPONSIVE UI (Clean, Heading & Description Included)
   ============================================================ */

@media (max-width: 820px) {
  body {
    padding: 12px 10px 40px;
  }

  .shell {
    padding: 22px 16px 36px;
    border-radius: 26px;
  }

  .nav {
    padding-bottom: 18px;
  }

  .based {
    font-size: 0.82rem;
  }

  /* Responsive Hero Section on Mobile */
  .hero {
    display: flex !important;
    flex-direction: column;
    align-items: flex-start;
    gap: 12px;
    padding: 4px 0 20px;
  }

  .hero h1 {
    font-size: 2.2rem;
    line-height: 1.1;
  }

  .hero-sub {
    text-align: left;
    font-size: 0.88rem;
    line-height: 1.55;
    max-width: 100%;
    margin: 0;
  }

  .gallery-status-bar {
    display: flex;
    padding-bottom: 12px;
    margin-bottom: 16px;
  }

  /* 2-Column True Masonry matching Phone UI */
  .gallery-container {
    display: block !important;
    columns: 2;
    column-gap: 12px;
  }

  .card {
    break-inside: avoid;
    margin-bottom: 12px;
    border-radius: var(--radius-tile-mobile);
    position: relative;
    overflow: hidden;
    height: auto !important;
    aspect-ratio: unset !important;
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.06);
  }

  .card:nth-child(n) {
    grid-column: unset !important;
    grid-row: unset !important;
  }

  .card img {
    position: static !important;
    width: 100% !important;
    height: auto !important;
    display: block !important;
  }

  .card-dl-btn {
    display: none;
  }
}

/* ============================================================
   FULL-SCREEN LIGHTBOX
   ============================================================ */

.lightbox {
  position: fixed;
  inset: 0;
  background: rgba(8, 7, 10, 0.96);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: space-between;
  z-index: 999;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s ease;
  user-select: none;
}

.lightbox.open {
  opacity: 1;
  pointer-events: auto;
}

/* Top Bar */
.lb-top-bar {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: flex-end;
  padding: 16px 20px;
  z-index: 1002;
}

.lb-close-btn {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.12);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border: 1px solid rgba(255, 255, 255, 0.2);
  color: #ffffff;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: transform 0.2s ease, background 0.2s ease;
}

.lb-close-btn:hover {
  background: rgba(255, 255, 255, 0.24);
  transform: scale(1.08);
}

/* Stage */
.lb-stage {
  flex: 1;
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0 16px;
  position: relative;
  overflow: hidden;
}

.lb-img {
  max-width: min(92vw, 1100px);
  max-height: calc(100vh - 160px);
  object-fit: contain;
  border-radius: 16px;
  box-shadow: 0 16px 48px rgba(0, 0, 0, 0.65);
  transform: scale(0.97);
  transition: transform 0.25s ease;
}

.lightbox.open .lb-img {
  transform: scale(1);
}

/* Side Arrows (Desktop only) */
.lb-nav-btn {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  width: 48px;
  height: 48px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.12);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border: 1px solid rgba(255, 255, 255, 0.2);
  color: #ffffff;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.2s ease;
  z-index: 1002;
}

.lb-nav-btn:hover {
  background: rgba(255, 255, 255, 0.24);
  transform: translateY(-50%) scale(1.08);
}

.lb-prev { left: 24px; }
.lb-next { right: 24px; }

/* Bottom Bar */
.lb-bottom-bar {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 14px;
  padding: 16px 20px 24px;
  z-index: 1002;
}

.lb-counter-pill {
  color: #ffffff;
  font-size: 0.85rem;
  font-weight: 600;
  letter-spacing: 0.04em;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
  background: rgba(255, 255, 255, 0.12);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border: 1px solid rgba(255, 255, 255, 0.2);
  padding: 9px 20px;
  border-radius: 999px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}

.lb-dl-btn {
  color: #111111;
  background: #ffffff;
  padding: 9px 22px;
  border-radius: 999px;
  text-decoration: none;
  font-weight: 650;
  font-size: 0.85rem;
  white-space: nowrap;
  display: inline-flex;
  align-items: center;
  gap: 7px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.25);
  transition: transform 0.2s ease, background 0.2s ease;
}

.lb-dl-btn:hover {
  transform: scale(1.05);
  background: #f5f5f5;
}

/* Mobile Quick Nav in Bottom Bar */
.lb-mobile-nav {
  display: none;
  width: 38px;
  height: 38px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.12);
  border: 1px solid rgba(255, 255, 255, 0.2);
  color: #fff;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}

@media (max-width: 820px) {
  .lb-nav-btn {
    display: none !important;
  }

  .lb-mobile-nav {
    display: flex;
  }

  .lb-top-bar {
    padding: 12px 14px;
  }

  .lb-close-btn {
    width: 40px;
    height: 40px;
  }

  .lb-stage {
    padding: 0 10px;
  }

  .lb-img {
    max-width: 96vw;
    max-height: calc(100vh - 140px);
    border-radius: 12px;
  }

  .lb-bottom-bar {
    gap: 10px;
    padding: 10px 14px calc(env(safe-area-inset-bottom, 12px) + 12px);
  }

  .lb-counter-pill {
    padding: 8px 14px;
    font-size: 0.78rem;
  }

  .lb-dl-btn {
    padding: 8px 16px;
    font-size: 0.78rem;
  }
}

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}

/* ============ FILTERS ============ */
.filters{margin-bottom:20px}
.tabs,.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 0}
.tabs::-webkit-scrollbar,.chips::-webkit-scrollbar{display:none}
.chips{margin-top:12px}
.tab,.chip{flex:none;font:inherit;cursor:pointer;border:1px solid var(--pill-border);background:var(--pill-bg);color:var(--ink-soft);border-radius:999px;transition:all .2s ease}
.tab{padding:9px 20px;font-size:.88rem;font-weight:650}
.chip{padding:6px 14px;font-size:.78rem;font-weight:550}
.tab:hover,.chip:hover{border-color:var(--ink-muted)}
.tab.active,.chip.active{background:var(--ink);color:var(--shell-bg);border-color:var(--ink)}
.empty{grid-column:1/-1;text-align:center;color:var(--ink-muted);padding:60px 0;font-size:.95rem}
.sentinel{height:2px}
.lb-top-bar{justify-content:space-between}
.lb-caption{color:#fff;font-size:.82rem;font-weight:550;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);padding:8px 16px;border-radius:999px;max-width:calc(100% - 70px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb-img{transition:transform .25s ease,opacity .2s ease}
.lb-img.loading{opacity:.75}
/* Tag mode (open the site with #tag at the end of the URL) */
.card.sel{outline:4px solid #4f7cff;outline-offset:-4px}
.tagpanel{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:900;display:flex;flex-wrap:wrap;gap:8px;align-items:center;max-width:94vw;background:var(--shell-bg);border:1px solid var(--line);border-radius:20px;padding:12px;box-shadow:0 12px 40px rgba(0,0,0,.3)}
.tagpanel[hidden]{display:none}
.tagpanel input,.tagpanel select,.tagpanel button{font:inherit;font-size:.8rem;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--pill-bg);color:var(--ink)}
.tagpanel button{cursor:pointer;font-weight:650}
.tagpanel #tApply{background:#4f7cff;color:#fff;border-color:#4f7cff}
@media (max-width:820px){
  .card:not(.loaded){min-height:170px}
  .tab{padding:8px 16px;font-size:.82rem}
}

/* ============ PINTEREST MASONRY ============ */
.gallery-container{display:flex!important;gap:16px!important;align-items:flex-start;columns:auto!important}
.mcol{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:16px}
.card{height:auto!important;aspect-ratio:auto!important;margin-bottom:0!important}
.card img{position:static!important;width:100%!important;height:auto!important;display:block!important;color:transparent}
.card:not(.loaded){aspect-ratio:3/4!important;min-height:0!important}
.empty{width:100%}
@media (max-width:820px){.gallery-container{gap:10px!important}.mcol{gap:10px}}
</style>
</head>
<body>

  <div class="shell">

    <!-- Top Navigation -->
    <nav class="nav">
      <div>
        <a href="#" class="brand">2nd Oct 26 - 5th Oct 26</a>
      </div>

      <div class="based">
        Based in: <b>West Bengal</b>
      </div>

      <div class="nav-right">
        <!-- Clean Dark / Light Mode Toggle Button -->
        <button class="btn-icon" id="desktopThemeBtn" title="Toggle Dark / Light Mode" aria-label="Toggle Dark / Light Mode">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
        </button>
      </div>
    </nav>

    <!-- Hero Section (Visible on both Mobile & Desktop) -->
    <section class="hero">
      <div class="hero-left">
        <span class="pill-badge">Our Stories</span>
        <h1>North bengal</h1>
      </div>
      <p class="hero-sub">
        Captured moments from North Bengal
      </p>
    </section>

    <!-- Filters -->
    <section class="filters">
      <div class="tabs" id="tabs"></div>
      <div class="chips" id="chips"></div>
    </section>

    <div class="gallery-status-bar">
      <span class="photo-count-label" id="photoCountLabel">Loading photographs…</span>
    </div>

    <main id="gallery" class="gallery-container" aria-live="polite"></main>
    <div class="sentinel" id="sentinel"></div>
  </div>

  <!-- Tag mode panel (only visible with #tag in URL) -->
  <div class="tagpanel" id="tagPanel" hidden>
    <b id="tSel">0 selected</b>
    <input id="tDay" placeholder="Day (e.g. Day 1)" size="12">
    <button id="tApply">Apply</button><button id="tAll">Select all shown</button><button id="tClear">Clear</button><button id="tExport">Copy OVERRIDES JSON</button>
  </div>

  <!-- Full-Screen Lightbox Modal -->
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-hidden="true">
    <!-- Top Bar with Close Button -->
    <div class="lb-top-bar">
      <span class="lb-caption" id="lbCap"></span>
      <button class="lb-close-btn" id="lbClose" aria-label="Close Lightbox">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>

    <!-- Center Stage with Image and Desktop Gutter Arrows -->
    <div class="lb-stage" id="lbStage">
      <button class="lb-nav-btn lb-prev" id="lbPrev" aria-label="Previous Photo">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 18l-6-6 6-6"/></svg>
      </button>

      <img class="lb-img" id="lbImg" src="" alt="Enlarged photo view" />

      <button class="lb-nav-btn lb-next" id="lbNext" aria-label="Next Photo">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M9 18l6-6-6-6"/></svg>
      </button>
    </div>

    <!-- Bottom Bar with Mobile Navigation, Single-line Counter and Download -->
    <div class="lb-bottom-bar">
      <button class="lb-mobile-nav" id="lbMobilePrev" aria-label="Previous Photo">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 18l-6-6 6-6"/></svg>
      </button>

      <div class="lb-counter-pill" id="lbCounter">001 / 283</div>

      <a class="lb-dl-btn" id="lbDownload" download>
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 3v12M7 10l5 5 5-5M5 20h14"/></svg>
        Download
      </a>

      <button class="lb-mobile-nav" id="lbMobileNext" aria-label="Next Photo">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M9 18l6-6-6-6"/></svg>
      </button>
    </div>
  </div>
<script>
(function () {
  "use strict";

  /* =====================================================
     1) CONFIG — edit this part only
     ===================================================== */
  const TOTAL_PHOTOS = 1478;                       // <-- your real image count
  const FOLDER = "./";   // where the ORIGINAL images are. Same repo: "./" or "./images/"  |  external (e.g. Cloudflare R2): "https://pub-xxxx.r2.dev/"
  const FILE_EXT = n => (n <= 144 ? "JPG" : "jpg"); // your original casing rule
  const FILENAME = n => `img (${n}).${FILE_EXT(n)}`;

  // Preview (thumbnail) source:
  //  "auto"   -> on GitHub Pages uses a free resize CDN (wsrv.nl), locally uses originals
  //  "cdn"    -> always use the CDN      "folder" -> use ./thumbs/<same filename>
  //  "none"   -> originals everywhere
  const THUMB_MODE = "auto";
  const THUMB_FOLDER = "./thumbs/";
  const THUMB_W = 520, THUMB_Q = 60;               // preview width & quality

  // ---- MANUAL TAGS (image numbers, ranges separated by commas) ----
  // keys that are plain numbers are shown as "Day 1", "Day 2", ...
  const TAGS = {
    day: {
      "1": "1-554",
      "2": "555-1126",
      "3": "1127-1478"
    }
  };

  // Single-image fixes made in tag mode (#tag) — optional, can stay empty
  const OVERRIDES = {};

  /* =====================================================
     2) DATA
     ===================================================== */
  const tagMode = location.hash === "#tag";
  if (tagMode) { try { Object.assign(OVERRIDES, JSON.parse(localStorage.getItem("gallery-tags") || "{}")); } catch (e) {} }

  // ---- turn the range strings into fast lookups ----
  function parseRanges(str) {
    const out = [];
    String(str).split(",").forEach(part => {
      const m = part.trim().match(/^(\d+)(?:\s*-\s*(\d+))?$/);
      if (m) out.push([+m[1], +(m[2] || m[1])]);
    });
    return out;
  }
  const inR = (rs, i) => rs.some(r => i >= r[0] && i <= r[1]);
  const compile = obj => Object.entries(obj || {}).map(([k, v]) => [/^\d+$/.test(k) ? "Day " + k : k, parseRanges(v)]);
  const C = { day: compile(TAGS.day) };
  const one = (list, i) => { const h = list.find(e => inR(e[1], i)); return h ? h[0] : ""; };

  function buildMeta(i) {
    const t = OVERRIDES[i] || {};
    const filename = FILENAME(i);
    return { id: i, filename, src: FOLDER + encodeURI(filename), day: t.day || one(C.day, i) || "Untagged" };
  }
  const photos = [];
  for (let i = 1; i <= TOTAL_PHOTOS; i++) photos.push(buildMeta(i));

  const useCdn = THUMB_MODE === "cdn" ||
    (THUMB_MODE === "auto" && location.protocol === "https:" && !/^(localhost|127\.)/.test(location.hostname));
  function thumbUrl(p) {
    if (THUMB_MODE === "none") return p.src;
    if (THUMB_MODE === "folder") return THUMB_FOLDER + encodeURI(p.filename);
    if (!useCdn) return p.src;
    const abs = new URL(p.src, location.href).href.replace(/\(/g, "%28").replace(/\)/g, "%29");
    return `https://wsrv.nl/?url=${encodeURIComponent(abs)}&w=${THUMB_W}&q=${THUMB_Q}&we&output=webp`;
  }

  /* =====================================================
     3) FILTERS
     ===================================================== */
  const TABS = [["all","All"],["day","Days"]];
  let tab = "all", val = "", view = photos.slice();

  const $ = id => document.getElementById(id);
  const galleryEl = $("gallery"), countLabel = $("photoCountLabel"), tabsEl = $("tabs"), chipsEl = $("chips"), sentinel = $("sentinel");

  function values() {
    const m = new Map();
    photos.forEach(p => m.set(p.day, (m.get(p.day) || 0) + 1));
    return [...m].sort((a, b) => a[0].localeCompare(b[0], undefined, { numeric: true }));
  }
  const matches = p => tab === "all" || !val || p.day === val;
  function buildTabs() {
    tabsEl.innerHTML = "";
    TABS.forEach(([k, l]) => {
      const b = document.createElement("button");
      b.className = "tab" + (k === tab ? " active" : "");
      b.textContent = l;
      b.onclick = () => { tab = k; val = ""; buildTabs(); applyFilter(); };
      tabsEl.appendChild(b);
    });
    chipsEl.innerHTML = "";
    if (tab === "day") {
      const mk = (label, v) => {
        const c = document.createElement("button");
        c.className = "chip" + (v === val ? " active" : "");
        c.textContent = label;
        c.onclick = () => { val = v; buildTabs(); applyFilter(); };
        chipsEl.appendChild(c);
      };
      mk("All", "");
      values(tab).forEach(([v, n]) => mk(`${v} · ${n}`, v));
    }
    chipsEl.hidden = !chipsEl.children.length;
  }
  function applyFilter() {
    view = photos.filter(matches);
    cards = []; rendered = 0; buildCols();
    countLabel.textContent = `${view.length} of ${photos.length} photographs`;
    if (!view.length) { galleryEl.innerHTML = `<p class="empty">No photos here yet.</p>`; return; }
    renderBatch();
  }

  /* =====================================================
     4) GALLERY
     ===================================================== */
  let cards = [], colEls = [], colCount = 0;
  const calcCols = () => { const w = galleryEl.clientWidth; return w < 480 ? 2 : w < 760 ? 3 : w < 1000 ? 4 : 5; };
  function placeCard(card) {           // put card in the currently shortest column
    let best = colEls[0];
    for (const c of colEls) if (c.offsetHeight < best.offsetHeight) best = c;
    best.appendChild(card);
  }
  function buildCols() {
    colCount = calcCols();
    galleryEl.innerHTML = "";
    colEls = [];
    for (let i = 0; i < colCount; i++) { const c = document.createElement("div"); c.className = "mcol"; galleryEl.appendChild(c); colEls.push(c); }
    cards.forEach(placeCard);
  }
  let rzT;
  window.addEventListener("resize", () => {
    clearTimeout(rzT);
    rzT = setTimeout(() => { if (view.length && calcCols() !== colCount) buildCols(); }, 150);
  });

  const BATCH = 40;
  let rendered = 0;
  const selected = new Set();
  let lastSel = null;

  // wrong .JPG/.jpg casing on the server? flip it once
  function swapCase(p) {
    const e = p.filename.match(/\.(\w+)$/)[1];
    const ne = e === e.toUpperCase() ? e.toLowerCase() : e.toUpperCase();
    p.filename = p.filename.slice(0, -e.length) + ne;
    p.src = FOLDER + encodeURI(p.filename);
    p.swapped = true;
  }
  // Download the untouched original (also works when images live on another site)
  async function saveOriginal(e, p) {
    if (new URL(p.src, location.href).origin === location.origin) return; // same site: normal download
    e.preventDefault();
    try {
      const r = await fetch(p.src); if (!r.ok) throw 0;
      const a = document.createElement("a");
      a.href = URL.createObjectURL(await r.blob());
      a.download = p.filename;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    } catch (err) { window.open(p.src, "_blank"); }
  }

  function createCard(p, index) {
    const card = document.createElement("figure");
    card.className = "card" + (selected.has(p.id) ? " sel" : "");
    card.tabIndex = 0;
    card.setAttribute("role", "button");
    card.setAttribute("aria-label", `View photo ${p.id}`);

    const shimmer = document.createElement("div");
    shimmer.className = "shimmer";

    const img = document.createElement("img");
    img.loading = "lazy";
    img.decoding = "async";
    img.alt = `Gallery photo ${p.id}`;
    img.src = thumbUrl(p);
    img.addEventListener("load", () => card.classList.add("loaded"));
    let stage = 0;
    img.addEventListener("error", () => {
      stage++;
      if (stage === 1 && thumbUrl(p) !== p.src) img.src = p.src;        // preview failed -> try the original
      else if (!p.swapped) { swapCase(p); dl.href = p.src; dl.download = p.filename; img.src = thumbUrl(p); stage = 0; } // maybe wrong casing -> retry once
      else card.style.display = "none";                                  // nothing worked -> hide
    });

    const dl = document.createElement("a");
    dl.className = "card-dl-btn";
    dl.href = p.src;               // always the ORIGINAL file
    dl.download = p.filename;
    dl.title = "Download original";
    dl.innerHTML = `<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12M7 10l5 5 5-5M5 20h14"/></svg>`;
    dl.addEventListener("click", e => { e.stopPropagation(); saveOriginal(e, p); });

    card.append(shimmer, img, dl);

    const act = e => (tagMode ? toggleSel(p, card, e.shiftKey) : openLightbox(index));
    card.addEventListener("click", act);
    card.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); act(e); } });
    return card;
  }

  function renderBatch() {
    const end = Math.min(rendered + BATCH, view.length);
    for (let i = rendered; i < end; i++) { const c = createCard(view[i], i); cards.push(c); placeCard(c); }
    rendered = end;
    io.unobserve(sentinel); io.observe(sentinel); // re-check if sentinel is still visible
  }
  const io = new IntersectionObserver(es => {
    if (es[0].isIntersecting && rendered < view.length) renderBatch();
  }, { rootMargin: "900px" });

  /* =====================================================
     5) LIGHTBOX  (shows ORIGINAL quality)
     ===================================================== */
  const lightbox = $("lightbox"), lbImg = $("lbImg"), lbStage = $("lbStage"), lbCounter = $("lbCounter"),
        lbDownload = $("lbDownload"), lbCap = $("lbCap");
  let cur = 0;

  function openLightbox(i) { cur = i; updateLightbox(); lightbox.classList.add("open"); lightbox.setAttribute("aria-hidden", "false"); document.body.style.overflow = "hidden"; }
  function closeLightbox() { lightbox.classList.remove("open"); lightbox.setAttribute("aria-hidden", "true"); document.body.style.overflow = ""; }
  function updateLightbox() {
    const p = view[cur]; if (!p) return;
    lbImg.classList.add("loading");
    lbImg.src = thumbUrl(p);                  // instant (already cached) preview...
    const full = new Image();
    full.onload = () => { if (view[cur] === p) { lbImg.src = p.src; lbImg.classList.remove("loading"); } }; // ...swapped for original
    full.src = p.src;
    lbCounter.textContent = `${String(cur + 1).padStart(3, "0")} / ${String(view.length).padStart(3, "0")}`;
    lbCap.textContent = p.day;
    lbDownload.href = p.src;
    lbDownload.download = p.filename;
  }
  function step(d) { cur = (cur + d + view.length) % view.length; updateLightbox(); }

  $("lbClose").onclick = closeLightbox;
  lbDownload.addEventListener("click", e => saveOriginal(e, view[cur]));
  $("lbPrev").onclick = $("lbMobilePrev").onclick = () => step(-1);
  $("lbNext").onclick = $("lbMobileNext").onclick = () => step(1);
  lightbox.addEventListener("click", e => { if (e.target === lightbox || e.target === lbStage) closeLightbox(); });
  lbStage.addEventListener("click", e => {
    if (e.target !== lbImg) return;
    const r = lbImg.getBoundingClientRect(), x = e.clientX - r.left;
    if (x < r.width * 0.3) step(-1); else if (x > r.width * 0.7) step(1);
  });
  document.addEventListener("keydown", e => {
    if (!lightbox.classList.contains("open")) return;
    if (e.key === "Escape") closeLightbox();
    if (e.key === "ArrowLeft") step(-1);
    if (e.key === "ArrowRight") step(1);
  });
  let tx = null;
  lightbox.addEventListener("touchstart", e => { tx = e.touches[0].clientX; }, { passive: true });
  lightbox.addEventListener("touchend", e => {
    if (tx === null) return;
    const d = e.changedTouches[0].clientX - tx;
    if (Math.abs(d) > 45) step(d > 0 ? -1 : 1);
    tx = null;
  }, { passive: true });

  /* =====================================================
     6) TAG MODE  (visit  yoursite/#tag  to tag photos visually)
     ===================================================== */
  function toggleSel(p, card, range) {
    if (range && lastSel !== null) {
      const a = view.findIndex(x => x.id === lastSel), b = view.findIndex(x => x.id === p.id);
      for (let i = Math.min(a, b); i <= Math.max(a, b); i++) selected.add(view[i].id);
      cards.forEach((c, i) => c.classList.toggle("sel", selected.has(view[i].id)));
    } else {
      selected.has(p.id) ? selected.delete(p.id) : selected.add(p.id);
      card.classList.toggle("sel");
    }
    lastSel = p.id;
    $("tSel").textContent = `${selected.size} selected`;
  }
  if (tagMode) {
    $("tagPanel").hidden = false;
    const refreshSel = () => { $("tSel").textContent = `${selected.size} selected`; cards.forEach((c, i) => c.classList.toggle("sel", selected.has(view[i].id))); };
    $("tApply").onclick = () => {
      const day = $("tDay").value.trim();
      selected.forEach(id => {
        const t = OVERRIDES[id] = OVERRIDES[id] || {};
        if (day) t.day = day;
        photos[id - 1] = buildMeta(id);
      });
      try { localStorage.setItem("gallery-tags", JSON.stringify(OVERRIDES)); } catch (e) {}
      selected.clear(); buildTabs(); applyFilter(); refreshSel();
    };
    $("tAll").onclick = () => { view.forEach(p => selected.add(p.id)); refreshSel(); };
    $("tClear").onclick = () => { selected.clear(); refreshSel(); };
    $("tExport").onclick = () => {
      const json = JSON.stringify(OVERRIDES);
      (navigator.clipboard ? navigator.clipboard.writeText(json) : Promise.reject()).then(
        () => alert("Copied! Paste it into  const OVERRIDES = ...  in index.html and push."),
        () => prompt("Copy this and paste it into const OVERRIDES:", json));
    };
  }

  /* =====================================================
     7) THEME
     ===================================================== */
  $("desktopThemeBtn").addEventListener("click", () => {
    const next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    try { localStorage.setItem("gallery-theme", next); } catch (e) {}
  });
  try { const s = localStorage.getItem("gallery-theme"); if (s) document.documentElement.setAttribute("data-theme", s); } catch (e) {}

  buildTabs();
  applyFilter();
})();
</script>
</body>
</html>
